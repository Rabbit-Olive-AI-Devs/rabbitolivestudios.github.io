name = "eink-dashboard"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# KV Namespace — after creating, paste your namespace ID below.
# Run: npx wrangler kv namespace create CACHE
# Then replace YOUR_NAMESPACE_ID with the id from the output.
[[kv_namespaces]]
binding = "CACHE"
id = "de97776d35af4df08b13fd2158acebdc"

# Cloudflare Workers AI (image generation + LLM)
[ai]
binding = "AI"

# Cloudflare Images (JPEG→PNG conversion for AI output)
[images]
binding = "IMAGES"

# Cloudflare Email Routing — lets the Worker email failure alerts with no
# third-party service, API key or account (DECISIONS #60). No destination_address
# here on purpose: the address lives in the ALERT_TO secret because this repo is
# public. Sending is still restricted to addresses verified on the account.
[[send_email]]
name = "SEND_EMAIL"

# R2 bucket for birthday reference photos
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "eink-birthday-photos"

# Cron schedules:
#   "35 4,5 * * *"    — daily image warm, BEFORE midnight Chicago: 04:35 UTC is 23:35 CDT /
#                       22:35 CST and 05:35 UTC is 00:35 CDT / 23:35 CST. Each fire warms the
#                       date the panels are about to ask for (tomorrow in the evening, today
#                       after midnight), so the keys are already filled when the date rolls
#                       and a device poll can never be the generator. The previous 05:05/06:05
#                       schedule fired AFTER the roll and left a 5-8 minute hole at 00:00 CDT;
#                       a poll in that hole generated on the request path (10-20s), SenseCraft's
#                       renderer timed out, and the E1002 skyline went white (DECISIONS #57,
#                       #64). Kept as ONE expression with two fire times: Workers Free allows
#                       only 5 cron triggers per account and the slots are already full.
#   "5 0,6,12,18 * * *" — headlines + weather + the failure-alert check (#60)
#
# The World Cup "*/15 * * * *" trigger was removed when the tournament dashboard was
# retired (DECISIONS #61) — it was 96 no-op invocations a day, and cron triggers are a
# scarce per-account resource on the free plan (5 across all Workers; see #57).
[triggers]
crons = ["35 4,5 * * *", "5 0,6,12,18 * * *"]
